# Tests autonomes : base H2 en mémoire, pour que `mvn verify` passe sans serveur MariaDB.
spring.datasource.url=jdbc:h2:mem:tests;MODE=MariaDB;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# schema.sql est un script MariaDB (CREATE DATABASE, USE) : il ne doit pas être joué sur H2.
spring.sql.init.mode=never

spring.mvc.hiddenmethod.filter.enabled=true
demo.mot-de-passe=mot-de-passe-de-test
