<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stations</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/entete :: entete}"></div>

<main>
    <h1>Stations du réseau</h1>
    <ul>
        <li th:each="station : ${stations}">
            <a th:href="@{/stations/{id}/equipements(id=${station.id})}" th:text="${station.nom}">Station</a>
        </li>
    </ul>
    <p th:if="${#lists.isEmpty(stations)}">Aucune station enregistrée.</p>
</main>
</body>
</html>
