spring.application.name=TpFilRouge
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
# Lit DB_PASSWORD, DEMO_MOT_DE_PASSE... depuis le fichier .env à la racine (non versionné).
spring.config.import=optional:file:.env[.properties]

# Railway (et la plupart des hébergeurs) impose son port via la variable PORT ; 8080 en local
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/guardian_bdd}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# 5.10.2 / 5.10.3 (note technique 3) -- Un formulaire HTML ne sait envoyer que GET et POST, or notre API utilise aussi PUT et DELETE.
# Cette propriété active le HiddenHttpMethodFilter de Spring MVC : il lit le champ caché "_method" du formulaire (valeur PUT ou DELETE)
# et fait comme si la requête POST avait cette méthode. Désactivé par défaut : sans cette ligne, "Supprimez" et "Modifiez" donnent une erreur 405.
spring.mvc.hiddenmethod.filter.enabled=true

# 5.10.2 / 5.12 -- Quand l'id n'existe pas, le contrôleur lève une ResponseStatusException (404) avec un message.
# Par défaut Spring Boot masque ce message dans la page d'erreur : cette propriété l'affiche, ce qui aide à comprendre l'erreur pendant le TP.
spring.web.error.include-message=always
demo.mot-de-passe=${DEMO_MOT_DE_PASSE}
